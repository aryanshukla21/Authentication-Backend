openapi: 3.0.0
info:
  title: TaskManager API
  version: 1.0.0
  description: REST API with JWT Authentication and Role-Based Access Control

servers:
  - url: http://localhost:5000/api/v1
    description: Development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [user, admin] }
    Task:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        status: { type: string, enum: [pending, in_progress, done] }
        priority: { type: string, enum: [low, medium, high] }
        dueDate: { type: string, format: date }
        userId: { type: string, format: uuid }

paths:
  /auth/register:
    post:
      summary: Register a new user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, example: Jane Doe }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        201: { description: User registered successfully }
        409: { description: Email already registered }
        422: { description: Validation error }

  /auth/login:
    post:
      summary: Login and receive JWT
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        200: { description: Login successful, returns JWT }
        401: { description: Invalid credentials }

  /auth/me:
    get:
      summary: Get current user
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      responses:
        200: { description: Current user data }
        401: { description: Unauthorized }

  /tasks:
    get:
      summary: Get all tasks (own tasks for users, all for admin)
      tags: [Tasks]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [pending, in_progress, done] }
        - in: query
          name: priority
          schema: { type: string, enum: [low, medium, high] }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 10 }
      responses:
        200: { description: Task list with pagination }
    post:
      summary: Create a task
      tags: [Tasks]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                description: { type: string }
                status: { type: string, enum: [pending, in_progress, done] }
                priority: { type: string, enum: [low, medium, high] }
                dueDate: { type: string, format: date }
      responses:
        201: { description: Task created }

  /tasks/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get single task
      tags: [Tasks]
      security: [{ bearerAuth: [] }]
      responses:
        200: { description: Task found }
        404: { description: Not found }
        403: { description: Access denied }
    put:
      summary: Update task
      tags: [Tasks]
      security: [{ bearerAuth: [] }]
      responses:
        200: { description: Updated }
    delete:
      summary: Delete task (soft delete)
      tags: [Tasks]
      security: [{ bearerAuth: [] }]
      responses:
        200: { description: Deleted }